<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precios BTC y ETH en vivo</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .contenedor {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      min-width: 320px;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 25px;
      color: #94a3b8;
    }
    .precio {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      margin: 10px 0;
      background: #334155;
      border-radius: 10px;
    }
    .moneda {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
    }
    .icono {
      width: 28px;
      height: 28px;
    }
    .valor {
      font-size: 1.2rem;
      color: #4ade80;
      font-weight: bold;
    }
    .estado {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #64748b;
    }
    .error {
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>💰 Precios en vivo</h1>

    <div class="precio">
      <div class="moneda">
        <img class="icono" src="https://assets.coingecko.com/coins/images/1/small/bitcoin.png" alt="BTC">
        Bitcoin (BTC)
      </div>
      <span class="valor" id="precio-btc">Cargando...</span>
    </div>

    <div class="precio">
      <div class="moneda">
        <img class="icono" src="https://assets.coingecko.com/coins/images/279/small/ethereum.png" alt="ETH">
        Ethereum (ETH)
      </div>
      <span class="valor" id="precio-eth">Cargando...</span>
    </div>

    <p class="estado" id="estado">Última actualización: --</p>
  </div>

  <script>
    // Formateador de moneda en USD
    const formatoUSD = new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD',
      minimumFractionDigits: 2
    });

    async function obtenerPrecios() {
      const estado = document.getElementById('estado');
      try {
        const respuesta = await fetch(
          'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true'
        );

        if (!respuesta.ok) {
          throw new Error('Error HTTP: ' + respuesta.status);
        }

        const data = await respuesta.json();

        // Actualizar precios
        document.getElementById('precio-btc').textContent =
          formatoUSD.format(data.bitcoin.usd);
        document.getElementById('precio-eth').textContent =
          formatoUSD.format(data.ethereum.usd);

        // Mostrar hora de actualización
        const ahora = new Date().toLocaleTimeString('es-ES');
        estado.textContent = 'Última actualización: ' + ahora;
        estado.classList.remove('error');

      } catch (error) {
        console.error('Error al obtener precios:', error);
        estado.textContent = '⚠️ Error al conectar con CoinGecko';
        estado.classList.add('error');
      }
    }

    // Ejecutar al cargar la página
    obtenerPrecios();

    // Actualizar cada 60 segundos (respetando el límite de la API gratuita)
    setInterval(obtenerPrecios, 60000);
  </script>

</body>
</html>
